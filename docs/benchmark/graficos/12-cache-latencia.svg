<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Latência por chamada ao modelo: sem cache × com cache">
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#898781}
