.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ring{stroke:#1a1a19}.frame{stroke:rgba(255,255,255,.1)}
.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.s4{fill:#c98500}.mute{fill:#5a5955}
.l1{stroke:#3987e5}.l2{stroke:#d95926}.lm{stroke:#5a5955}}
</style>
<title>Latência por chamada ao modelo: sem cache × com cache</title>
<rect class="bg frame" x="0.5" y="0.5" width="759" height="247" rx="8" stroke-width="1"/>
<text x="20" y="28" font-size="15" font-weight="600" class="t1">Latência por chamada ao modelo: sem cache × com cache</text>
<text x="20" y="47" font-size="12" class="t2">Mediana da duração de cada chamada. Verde = sem nada do cache; azul = parte do prompt veio do cache.</text>
<circle cx="26" cy="66" r="5" class="s1"/>
