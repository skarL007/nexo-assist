<line x1="532" x2="532" y1="78" y2="204" class="grid" stroke-width="1"/>
<text x="532" y="220" text-anchor="middle" font-size="11" class="t3">9,6 s</text>
<line x1="610" x2="610" y1="78" y2="204" class="grid" stroke-width="1"/>
<text x="610" y="220" text-anchor="middle" font-size="11" class="t3">12,0 s</text>
<text x="210" y="103" text-anchor="end" font-size="12" class="t1">GPT-6 Luna ★</text>
<line x1="267.9" x2="275.7" y1="99" y2="99" class="l1" stroke-width="2" stroke-linecap="round"/>
