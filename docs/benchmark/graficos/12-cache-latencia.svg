<circle cx="270.9" cy="129" r="6" class="s1 ring" stroke-width="2"><title>DeepSeek V4.1 Flash: 1,9 s → 1,6 s</title></circle>
<text x="622" y="133" font-size="11.5" class="t2">1,9 s → 1,6 s</text>
<text x="210" y="163" text-anchor="end" font-size="12" class="t1">Mistral Small 4</text>
<line x1="279.5" x2="285.1" y1="159" y2="159" class="l1" stroke-width="2" stroke-linecap="round"/>
