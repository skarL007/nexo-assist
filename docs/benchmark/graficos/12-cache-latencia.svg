<line x1="376" x2="376" y1="78" y2="204" class="grid" stroke-width="1"/>
<text x="376" y="220" text-anchor="middle" font-size="11" class="t3">4,8 s</text>
<line x1="454" x2="454" y1="78" y2="204" class="grid" stroke-width="1"/>
