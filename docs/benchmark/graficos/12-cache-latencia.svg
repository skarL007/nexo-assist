<line x1="220" x2="220" y1="78" y2="204" class="grid" stroke-width="1"/>
<text x="220" y="220" text-anchor="middle" font-size="11" class="t3">0,0 s</text>
<line x1="298" x2="298" y1="78" y2="204" class="grid" stroke-width="1"/>
