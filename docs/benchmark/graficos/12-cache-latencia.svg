<circle cx="279.5" cy="159" r="6" class="s1 ring" stroke-width="2"><title>Mistral Small 4: 2,0 s → 1,8 s</title></circle>
<text x="622" y="163" font-size="11.5" class="t2">2,0 s → 1,8 s</text>
<text x="210" y="193" text-anchor="end" font-size="12" class="t1">Qwen3.8 Flash (sem raciocínio)</text>
<line x1="316.5" x2="595.3" y1="189" y2="189" class="l1" stroke-width="2" stroke-linecap="round"/>
<circle cx="595.3" cy="189" r="4.5" class="s3 ring" stroke-width="2"><title>Qwen3.8 Flash (sem raciocínio): sem cache 11,5 s</title></circle>
<circle cx="316.5" cy="189" r="6" class="s1 ring" stroke-width="2"><title>Qwen3.8 Flash (sem raciocínio): 11,5 s → 3,0 s</title></circle>
<text x="622" y="193" font-size="11.5" class="t2">11,5 s → 3,0 s</text>
