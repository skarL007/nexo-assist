.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#898781}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ring{stroke:#1a1a19}.frame{stroke:rgba(255,255,255,.1)}
.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.s4{fill:#c98500}.mute{fill:#5a5955}
.l1{stroke:#3987e5}.l2{stroke:#d95926}.lm{stroke:#5a5955}}
</style>
<title>Quanto o cache economizou no benchmark inteiro</title>
<rect class="bg frame" x="0.5" y="0.5" width="759" height="263" rx="8" stroke-width="1"/>
<text x="20" y="28" font-size="15" font-weight="600" class="t1">Quanto o cache economizou no benchmark inteiro</text>
<text x="20" y="47" font-size="12" class="t2">Do custo que teríamos sem cache até o que foi pago de fato (candidatos + juízes).</text>
<rect x="20" y="60" width="12" height="12" rx="2" class="s1"/>
<text x="38" y="70" font-size="12" class="t1">custo</text>
<rect x="91" y="60" width="12" height="12" rx="2" class="s3"/>
<text x="109" y="70" font-size="12" class="t1">economia</text>
<line x1="220" x2="220" y1="78" y2="220" class="grid" stroke-width="1"/>
<text x="220" y="236" text-anchor="middle" font-size="11" class="t3">US$ 0,0000</text>
<line x1="332.5" x2="332.5" y1="78" y2="220" class="grid" stroke-width="1"/>
<text x="332.5" y="236" text-anchor="middle" font-size="11" class="t3">US$ 0,337</text>
<line x1="445" x2="445" y1="78" y2="220" class="grid" stroke-width="1"/>
<text x="445" y="236" text-anchor="middle" font-size="11" class="t3">US$ 0,674</text>
<line x1="557.5" x2="557.5" y1="78" y2="220" class="grid" stroke-width="1"/>
<text x="557.5" y="236" text-anchor="middle" font-size="11" class="t3">US$ 1,01</text>
<line x1="670" x2="670" y1="78" y2="220" class="grid" stroke-width="1"/>
<text x="670" y="236" text-anchor="middle" font-size="11" class="t3">US$ 1,35</text>
<text x="210" y="105" text-anchor="end" font-size="12" class="t1">Sem cache (contrafactual)</text>
<path d="M220,90 H666 Q670,90 670,94 V108 Q670,112 666,112 H220 Z" class="s1"><title>Sem cache (contrafactual): US$ 1,35</title></path>
<text x="676" y="105" font-size="12" class="t1">US$ 1,35</text>
<line x1="670" x2="670" y1="112" y2="124" class="axis" stroke-width="1"/>
<text x="210" y="139" text-anchor="end" font-size="12" class="t1">Cache do provedor</text>
<path d="M638.1,124 H666 Q670,124 670,128 V142 Q670,146 666,146 H638.1 Z" class="s3"><title>Cache do provedor: US$ 0,096</title></path>
