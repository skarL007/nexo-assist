<text x="644.1" y="173" font-size="12" class="t1">−US$ 0,0059</text>
<line x1="636.1" x2="636.1" y1="180" y2="192" class="axis" stroke-width="1"/>
<text x="210" y="207" text-anchor="end" font-size="12" class="t1">Pago</text>
