# CI no CircleCI (plano Free para projeto open source: sem cartão, status aparece no GitHub).
# Os mesmos passos do .github/workflows/ci.yml, que fica valendo se o GitHub Actions voltar.
# A imagem oficial do Playwright já traz Node 24 e o Chromium da mesma versão do @playwright/test:
# ao atualizar o Playwright, atualize a tag junto.
version: 2.1

executors:
  pw:
    docker:
      - image: mcr.microsoft.com/playwright:v1.64.1-noble
    resource_class: medium
    working_directory: ~/repo

commands:
  install:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  checks:
    executor: pw
    steps:
      - install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    executor: pw
    steps:
      - install
      - run:
          name: E2E (Playwright contra o build de produção, sem LLM)
          command: npm run test:e2e
          no_output_timeout: 15m
      - store_artifacts:
          path: test-results
          destination: playwright-traces

workflows:
  ci:
    jobs:
      - checks
      - e2e
