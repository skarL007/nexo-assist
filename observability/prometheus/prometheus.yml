global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: nexo-assist
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      # O container do app no Komodo publica a porta 3300 no host.
      - targets: ["host.docker.internal:3300"]
        labels: { env: komodo }
