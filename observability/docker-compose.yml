# Observabilidade do Nexo Assist: Prometheus (métricas), Grafana (painel) e Jaeger (traces OTLP).
# Sobe ao lado da stack do app no Komodo. Antes: crie o arquivo prometheus/metrics-token com o
# mesmo valor do METRICS_TOKEN do app (sem quebra de linha) e defina GRAFANA_ADMIN_PASSWORD.
#
#   docker compose -f observability/docker-compose.yml up -d
#   Grafana: http://127.0.0.1:3301 · Prometheus: http://127.0.0.1:9090 · Jaeger: http://127.0.0.1:16686
#
# No app: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://127.0.0.1:4318/v1/traces manda os spans ao Jaeger.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3301:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "127.0.0.1:16686:16686" # interface
      - "127.0.0.1:4318:4318"   # OTLP/HTTP
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
